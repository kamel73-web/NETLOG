name: Cloner prod vers staging
on:
  workflow_dispatch:

jobs:
  clone:
    runs-on: ubuntu-latest
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - name: Installer le client PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Garde-fou (empêche toute inversion prod/staging)
        run: |
          NP=$(psql "$PROD_DB_URL" -Atc "select count(*) from information_schema.tables where table_schema='public'")
          NS=$(psql "$STAGING_DB_URL" -Atc "select count(*) from information_schema.tables where table_schema='public'")
          echo "Tables PROD_DB_URL    : $NP (attendu 35)"
          echo "Tables STAGING_DB_URL : $NS (attendu 0)"
          [ "$NP" -ge 30 ] || { echo "ERREUR : PROD_DB_URL ne pointe pas vers la production"; exit 1; }
          [ "$NS" -eq 0 ] || { echo "ERREUR : le staging n'est pas vide"; exit 1; }

           - name: Exporter la structure de la production (lecture seule)
        run: |
          pg_dump "$PROD_DB_URL" --schema-only --schema=public --no-owner -f schema.sql
          sed -i '/^CREATE SCHEMA public;$/d' schema.sql
          sed -i '/netlog_schema_reader/d' schema.sql
          pg_dump "$PROD_DB_URL" --data-only --no-owner --table=public.subscription_plans --table=public.subscription_plans_id_seq -f plans.sql

      - name: Appliquer sur le staging
        run: |
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -c 'create extension if not exists "uuid-ossp" with schema extensions' -c 'create extension if not exists pgcrypto with schema extensions'
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f schema.sql
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f plans.sql

      - name: Trigger auth, bucket et politiques Storage
        run: |
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          create trigger trg_on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();
          insert into storage.buckets (id, name, public) values ('payment-proofs', 'payment-proofs', false) on conflict (id) do nothing;
          create policy payment_proofs_insert on storage.objects as permissive for insert to authenticated with check (bucket_id = 'payment-proofs' and (storage.foldername(name))[1] = auth.uid()::text);
          create policy payment_proofs_select on storage.objects as permissive for select to authenticated using (bucket_id = 'payment-proofs' and ((storage.foldername(name))[1] = auth.uid()::text or public.is_admin()));
          SQL

      - name: Vérification (comptes uniquement)
        run: |
          psql "$STAGING_DB_URL" -Atc "select 'tables', count(*) from information_schema.tables where table_schema='public' union all select 'fonctions', count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' union all select 'politiques', count(*) from pg_policies where schemaname='public' union all select 'colonnes', count(*) from information_schema.columns where table_schema='public' union all select 'index', count(*) from pg_indexes where schemaname='public'"
